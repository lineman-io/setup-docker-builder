# runners.io setup-docker-builder HAS MOVED to runners-io/setup-docker-builder
# (RUN-856). This repository now only forwards to it, so a workflow that still
# says
#
#     - uses: lineman-io/setup-docker-builder@v1
#
# keeps working unchanged. New workflows should say
#
#     - uses: runners-io/setup-docker-builder@v1
#
# WHY A FORWARDING COPY AND NOT A GITHUB TRANSFER. GitHub does not redirect an
# action's `uses:` across a repository transfer or rename -- a workflow naming
# the old path fails with "repository not found" -- and a busy repository's old
# name can be retired for good, leaving nowhere to put a forwarder. So the
# action was copied to its new home (same history, same tags) and this
# repository's v1 now calls it.
#
# PINNED TO A COMMIT, not to @v1 of the new home: this name is deprecated, so it
# forwards to one reviewed release (v1.0.1) rather than following later ones.
# v1.0.0 here still points at the original, self-contained action.
#
# Inputs and outputs are passed through unchanged, with the same defaults.
name: runners.io setup docker builder (moved to runners-io/setup-docker-builder)
description: >-
  Moved to runners-io/setup-docker-builder. This forwards to it: point every
  Docker build in the job at the runners.io layer cache, in one line.
author: runners.io

inputs:
  automatic:
    description: >-
      Passed through to runners-io/setup-docker-builder. 'true' (the default):
      every docker build after this step that names no cache of its own uses the
      layer cache.
    required: false
    default: 'true'
  key:
    description: Passed through to runners-io/setup-docker-builder. The cache's name for this image; empty derives one per image.
    required: false
    default: ''

outputs:
  enabled:
    description: "'true' when the layer cache is set up for this job, 'false' when this step did nothing."
    value: ${{ steps.forward.outputs.enabled }}
  builder:
    description: The buildx builder the job now uses. Empty when enabled is false.
    value: ${{ steps.forward.outputs.builder }}
  ref:
    description: The cache reference for `key` (or `default`). Empty when enabled is false.
    value: ${{ steps.forward.outputs.ref }}
  cache-from:
    description: A cache-from value for that reference. Empty when enabled is false.
    value: ${{ steps.forward.outputs.cache-from }}
  cache-to:
    description: A cache-to value for that reference. Empty when enabled is false.
    value: ${{ steps.forward.outputs.cache-to }}

runs:
  using: composite
  steps:
    - id: forward
      uses: runners-io/setup-docker-builder@344ebc048dc7e98faac0c69b69da320b4bf3a6aa # v1.0.1
      with:
        automatic: ${{ inputs.automatic }}
        key: ${{ inputs.key }}
